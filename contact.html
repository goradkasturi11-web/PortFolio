<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Kasturi Gorad through an accessible portfolio contact form.">
    <meta name="author" content="Kasturi Gorad">
    <meta name="robots" content="index, follow">
    <title>Contact | Kasturi Gorad Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header>
        <h1>Contact Me</h1>
        <p>Get in touch with me</p>
    </header>

    <nav aria-label="Primary navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
    </nav>

    <main id="main-content">
        <section aria-labelledby="contact-heading">
            <h2 id="contact-heading">Send a Message</h2>
            <p>All fields marked with <span aria-hidden="true">*</span> are required.</p>

            <form action="#" method="post" aria-label="Contact form">
                <div class="form-group">
                    <label for="name">Name <span aria-hidden="true">*</span></label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email <span aria-hidden="true">*</span></label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message <span aria-hidden="true">*</span></label>
                    <textarea
                        id="message"
                        name="message"
                        required
                        aria-required="true"
                    ></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section aria-labelledby="direct-contact-heading">
            <h2 id="direct-contact-heading">Direct Contact</h2>
            <address>
                <p>
                    Email:
                    <a href="mailto:goradkasturi11@gmail.com">
                        goradkasturi11@gmail.com
                    </a>
                </p>
                <p>
                    Phone:
                    <a href="tel:+91 1234567890">
                        1234567890
                    </a>
                </p>
            </address>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kasturi Gorad. All rights reserved.</p>
    </footer>
</body>
</html>
